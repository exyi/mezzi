[project]
name = "rakaslop"
version = "0.1.0"
description = "Patient side-effect tracking and SUKL document extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "dspy>=3.4.0",
    "fastapi",
    "httpx2>=2.13.1",
    "openai>=2.0.0",
    "pydantic>=2.12.0",
    "pydantic-ai>=2.54.0",
    "tqdm>=4.60.1",
    "uvicorn",
]

[project.scripts]
backend = "backend:main"
sukl = "sukl:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "sukl"]
package-dir = { backend = "app/backend/src/backend", sukl = "sukl/src/sukl" }

[tool.uv]
exclude-newer = "7 days"

[tool.ruff.lint]
ignore = ["I001"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
