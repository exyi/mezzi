[project]
name = "sukl"
version = "0.1.0"
description = "Source-grounded extraction of SUKL drug documents with Pydantic AI"
readme = "README.md"
authors = [
    { name = "Standa Lukeš", email = "exyi@outlook.cz" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "dspy>=3.4.0",
    "httpx2>=2.13.1",
    "pydantic-ai>=2.54.0",
    "pydantic>=2.12.0",
    "openai>=2.0.0",
]

[project.scripts]
sukl = "sukl:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
